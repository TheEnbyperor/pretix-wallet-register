[package]
name = "pretix-wallet"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3.77"
reqwest = { version = "0.12.22", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
uic-ticket = { path = "../uic-ticket-rs" }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
wasm-logger = "0.2.0"
web-sys = { version = "0.3.77", features = ["console", "Navigator", "Window", "Storage"] }
log = "0.4.27"
base85 = "2.0.0"
rasn = "0.27.1"

[build-dependencies]
rasn-compiler = { version = "0.14.2", path = "../rasn-compiler/rasn-compiler" }